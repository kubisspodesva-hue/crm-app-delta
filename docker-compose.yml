version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: delta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delta_user
      POSTGRES_PASSWORD: delta_password
      POSTGRES_DB: delta_db
    ports:
      - '5432:5432'
    volumes:
      - delta_pg_data:/var/lib/postgresql/data

volumes:
  delta_pg_data:
